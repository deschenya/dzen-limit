<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9E5DB">
<title>Дневной лимит</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=cyrillic,latin" rel="stylesheet">
<style>
:root{
  --paper:#E9E5DB;
  --card:#F4F1E9;
  --ink:#17150F;
  --graphite:#7A7264;
  --rule:#D5CFC0;
  --currant:#C6122E;
  --currant-deep:#9A0C23;

  --display:'Oswald', 'Arial Narrow', system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  font-family:var(--body);
  background:#26231D;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}

/* ── iPhone 15 Pro: 393 × 852 ─────────────────────────── */
.phone{
  width:393px;height:852px;
  background:var(--paper);
  border-radius:54px;
  overflow:hidden;
  position:relative;
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 11px #0d0c0a, 0 0 0 13px #45403a;
  display:flex;flex-direction:column;
}
@media (max-width:440px), (display-mode:standalone){
  body{padding:0;background:var(--paper);align-items:stretch}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

.screen{
  flex:1;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 20px);
  overflow:hidden;
}
@media (max-width:440px){ .screen{padding-top:calc(env(safe-area-inset-top) + 22px)} }

/* ── ornament hairline (рушнік motif) ─────────────────── */
.ornament{
  height:9px;flex:none;
  background:
    repeating-linear-gradient(45deg,  var(--currant) 0 1.5px, transparent 1.5px 9px),
    repeating-linear-gradient(-45deg, var(--currant) 0 1.5px, transparent 1.5px 9px);
  opacity:.5;
}

/* ── header ───────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px}
.eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--graphite);
}
.today{
  font-family:var(--display);font-weight:500;font-size:26px;
  letter-spacing:.01em;line-height:1.05;margin-top:3px;color:var(--ink);
}
.datepick{
  font-family:var(--mono);font-size:11px;color:var(--graphite);
  background:none;border:1px solid var(--rule);border-radius:8px;
  padding:6px 8px;color-scheme:light;
}
.datepick:focus-visible{outline:2px solid var(--currant);outline-offset:2px}

/* ── input ────────────────────────────────────────────── */
.field{margin-top:24px;flex:none}
.label{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--graphite);display:block;margin-bottom:8px;
}
.inputwrap{
  display:flex;align-items:baseline;gap:10px;
  border-bottom:2px solid var(--ink);padding-bottom:9px;
}
.inputwrap input{
  flex:1;min-width:0;border:none;background:none;
  font-family:var(--display);font-weight:500;font-size:42px;
  letter-spacing:.005em;color:var(--ink);
}
.inputwrap input::placeholder{color:#C2BAA8}
.inputwrap input:focus{outline:none}
.cur{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--graphite)}

/* ── signature: payout band ───────────────────────────── */
.band{
  margin-top:26px;flex:none;
  background:var(--currant);color:var(--card);
  border-radius:4px;padding:18px 20px 20px;
  position:relative;overflow:hidden;
}
.band::before{
  content:"";position:absolute;inset:0 0 auto 0;height:7px;
  background:
    repeating-linear-gradient(45deg,  rgba(244,241,233,.85) 0 1.5px, transparent 1.5px 7px),
    repeating-linear-gradient(-45deg, rgba(244,241,233,.85) 0 1.5px, transparent 1.5px 7px);
}
.band .label{color:rgba(244,241,233,.75);margin:6px 0 4px}
.amount{
  font-family:var(--display);font-weight:600;font-size:66px;line-height:.95;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;
}
.amount.idle{font-size:26px;line-height:1.5;opacity:.8;font-weight:400}
.bandfoot{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:12px;padding-top:11px;border-top:1px solid rgba(244,241,233,.3);
  font-family:var(--mono);font-size:11px;letter-spacing:.03em;
}
.bandfoot b{font-weight:600}

/* ── ribbon: один тик = один день ─────────────────────── */
.ribbon{margin-top:22px;flex:none}
.ticks{display:flex;align-items:flex-end;gap:4px;height:34px}
.tick{flex:1;background:var(--ink);opacity:.28;border-radius:1px;height:14px}
.tick.first{opacity:.85;height:22px}
.tick.pay{
  flex:none;width:16px;height:16px;background:var(--currant);opacity:1;
  transform:rotate(45deg);border-radius:2px;margin:0 3px 3px 5px;
}
.ticklab{
  display:flex;justify-content:space-between;margin-top:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--graphite);
}
.ticklab b{color:var(--currant);font-weight:600}

/* ── upcoming payouts ─────────────────────────────────── */
.list{margin-top:auto;padding-top:18px;flex:none}
.row{
  display:grid;grid-template-columns:58px 1fr auto;align-items:baseline;gap:10px;
  padding:11px 0;border-top:1px solid var(--rule);
}
.row .d{font-family:var(--display);font-size:19px;font-weight:500;color:var(--ink)}
.row .t{font-size:13px;font-weight:500;color:var(--ink)}
.row .t small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--currant);letter-spacing:.04em;margin-top:2px}
.row .w{font-family:var(--mono);font-size:11px;color:var(--graphite);text-transform:uppercase}

.note{
  margin-top:14px;font-size:10.5px;line-height:1.5;color:var(--graphite);
  border-left:2px solid var(--rule);padding-left:9px;
}

@media (prefers-reduced-motion:no-preference){
  .amount,.tick{transition:opacity .18s ease, height .18s ease}
}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="ornament"></div>

    <div class="head">
      <div>
        <span class="eyebrow">Сегодня</span>
        <div class="today" id="todayLabel">—</div>
      </div>
      <input type="date" class="datepick" id="dateInput" aria-label="Дата отсчёта">
    </div>

    <div class="field">
      <label class="label" for="money">Осталось денег</label>
      <div class="inputwrap">
        <input id="money" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
        <span class="cur">BYN</span>
      </div>
    </div>

    <div class="band">
      <span class="label">Можно тратить в день</span>
      <div class="amount idle" id="perDay">Введите сумму</div>
      <div class="bandfoot">
        <span id="untilLabel">до ближайшей выплаты</span>
        <span id="daysLabel"></span>
      </div>
    </div>

    <div class="ribbon">
      <div class="ticks" id="ticks"></div>
      <div class="ticklab">
        <span>Сегодня</span>
        <b id="payTag">—</b>
      </div>
    </div>

    <div class="list" id="list"></div>

    <p class="note">10-е и 24-е числа. Если выпадает на выходной или праздник по календарю РБ — выплата в предыдущий рабочий день. Переносы рабочих дней постановлениями Совмина не учитываются.</p>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ── календарь РБ ─────────────────────────────────── */
  var FIXED = [[1,1],[1,2],[1,7],[3,8],[5,1],[5,9],[7,3],[11,7],[12,25]];

  function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function diffDays(a,b){
    return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())
                     - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
  }

  // православная Пасха (юлианский расчёт → григорианская дата)
  function orthodoxEaster(y){
    var a=y%4, b=y%7, c=y%19;
    var d=(19*c+15)%30;
    var e=(2*a+4*b-d+34)%7;
    var m=Math.floor((d+e+114)/31);
    var day=((d+e+114)%31)+1;
    return new Date(y, m-1, day+13);
  }
  function radunitsa(y){ return addDays(orthodoxEaster(y), 9); }

  function isHoliday(d){
    var m=d.getMonth()+1, day=d.getDate();
    for(var i=0;i<FIXED.length;i++) if(FIXED[i][0]===m && FIXED[i][1]===day) return true;
    var r=radunitsa(d.getFullYear());
    return r.getMonth()===d.getMonth() && r.getDate()===d.getDate();
  }
  function isDayOff(d){ var w=d.getDay(); return w===0||w===6||isHoliday(d); }
  function shiftBack(d){ var x=d; var g=0; while(isDayOff(x) && g++<20) x=addDays(x,-1); return x; }

  /* ── выплаты ──────────────────────────────────────── */
  var KINDS=[[10,'Зарплата'],[24,'Аванс']];
  function payouts(from, count){
    var res=[], y=from.getFullYear(), mo=from.getMonth();
    for(var k=-1;k<=5;k++){
      for(var i=0;i<KINDS.length;i++){
        var nominal=new Date(y, mo+k, KINDS[i][0]);
        var actual=shiftBack(nominal);
        if(diffDays(from, actual) > 0) res.push({nominal:nominal, actual:actual, kind:KINDS[i][1]});
      }
    }
    res.sort(function(a,b){return a.actual-b.actual;});
    return res.slice(0,count);
  }

  /* ── форматирование ───────────────────────────────── */
  var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WD =['вс','пн','вт','ср','чт','пт','сб'];
  var nf = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2, maximumFractionDigits:2});
  function pad(n){ return (n<10?'0':'')+n; }
  function plural(n,a,b,c){
    var n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return a;
    if(n10>=2 && n10<=4 && (n100<10||n100>=20)) return b;
    return c;
  }

  /* ── элементы ─────────────────────────────────────── */
  var elDate=document.getElementById('dateInput'),
      elToday=document.getElementById('todayLabel'),
      elMoney=document.getElementById('money'),
      elPerDay=document.getElementById('perDay'),
      elUntil=document.getElementById('untilLabel'),
      elDays=document.getElementById('daysLabel'),
      elTicks=document.getElementById('ticks'),
      elPayTag=document.getElementById('payTag'),
      elList=document.getElementById('list');

  var today=midnight(new Date());
  elDate.value = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());

  function parseMoney(s){
    var v = String(s).replace(/\s|\u00A0/g,'').replace(',','.').replace(/[^\d.]/g,'');
    var n = parseFloat(v);
    return isFinite(n) && n>=0 ? n : null;
  }

  function render(){
    var parts=elDate.value.split('-');
    var base = parts.length===3 ? new Date(+parts[0], +parts[1]-1, +parts[2]) : today;
    if(isNaN(base)) base = today;

    elToday.textContent = base.getDate()+' '+MON[base.getMonth()];

    var next = payouts(base, 4);
    var p = next[0];
    var days = diffDays(base, p.actual);          // сегодня входит в период
    var money = parseMoney(elMoney.value);

    // главное число
    if(money===null || money===0){
      elPerDay.classList.add('idle');
      elPerDay.textContent = money===0 ? 'Денег нет' : 'Введите сумму';
    } else {
      elPerDay.classList.remove('idle');
      elPerDay.textContent = nf.format(money/days);
    }

    elUntil.innerHTML = 'до ' + pad(p.actual.getDate())+'.'+pad(p.actual.getMonth()+1) +
                        ' · <b>'+p.kind.toLowerCase()+'</b>';
    elDays.textContent = days+' '+plural(days,'день','дня','дней');

    // лента дней
    elTicks.innerHTML='';
    var shown = Math.min(days, 24);
    for(var i=0;i<shown;i++){
      var t=document.createElement('div');
      t.className='tick'+(i===0?' first':'');
      elTicks.appendChild(t);
    }
    var pay=document.createElement('div');
    pay.className='tick pay';
    elTicks.appendChild(pay);
    elPayTag.textContent = p.kind+' '+pad(p.actual.getDate())+'.'+pad(p.actual.getMonth()+1);

    // ближайшие выплаты
    elList.innerHTML='';
    for(var j=0;j<3;j++){
      var q=next[j];
      var moved = diffDays(q.nominal, q.actual) !== 0;
      var row=document.createElement('div');
      row.className='row';
      row.innerHTML =
        '<span class="d">'+pad(q.actual.getDate())+'.'+pad(q.actual.getMonth()+1)+'</span>'+
        '<span class="t">'+q.kind+ (moved ? '<small>перенос с '+pad(q.nominal.getDate())+'.'+pad(q.nominal.getMonth()+1)+'</small>' : '') +'</span>'+
        '<span class="w">'+WD[q.actual.getDay()]+'</span>';
      elList.appendChild(row);
    }
  }

  elMoney.addEventListener('input', render);
  elDate.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
