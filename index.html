<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лимиты">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" id="themeColor">
<title>Лимиты</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://api.nbrb.by">
<script>
/* тема ставится до отрисовки — без вспышки светлого */
(function(){
  var t=null;
  try{ t=localStorage.getItem('theme'); }catch(e){}
  if(t!=='dark'&&t!=='light') t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
/* системные цвета iOS */
:root{
  --bg:#F2F2F7;              /* systemGroupedBackground */
  --card:#FFFFFF;            /* secondarySystemGroupedBackground */
  --label:#000000;
  --label2:rgba(60,60,67,.6);
  --label3:rgba(60,60,67,.3);
  --separator:rgba(60,60,67,.29);
  --fill3:rgba(118,118,128,.12);   /* tertiarySystemFill */
  --seg-on:#FFFFFF;
  --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --red:#FF3B30;                   /* systemRed */
  --red-soft:rgba(255,59,48,.12);
  --blue:#007AFF;                  /* systemBlue — цвет действий */
  --tick-past:rgba(120,120,128,.12);
  --tick-work:rgba(120,120,128,.30);
  --tick-off:rgba(120,120,128,.58);
  --shell:#C7C7CC;
  --scheme:light;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;
  --num:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E;
  --label:#FFFFFF;
  --label2:rgba(235,235,245,.6);
  --label3:rgba(235,235,245,.3);
  --separator:rgba(84,84,88,.65);
  --fill3:rgba(118,118,128,.24);
  --seg-on:#636366;
  --seg-shadow:0 3px 8px rgba(0,0,0,.3);
  --red:#FF453A; --red-soft:rgba(255,69,58,.18); --blue:#0A84FF;
  --tick-past:rgba(120,120,128,.20);
  --tick-work:rgba(120,120,128,.42);
  --tick-off:rgba(142,142,147,.85);
  --shell:#1C1C1E; --scheme:dark;
}
html{color-scheme:var(--scheme)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--sans);font-size:17px;color:var(--label);background:var(--shell);
  height:100vh;height:100dvh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* макет устройства — только для превью на широком экране */
.phone{
  width:393px;height:852px;max-height:100%;background:var(--bg);
  border-radius:54px;overflow:hidden;position:relative;
  box-shadow:0 40px 90px rgba(0,0,0,.35),0 0 0 11px #0d0c0a,0 0 0 13px #45403a;
  display:flex;flex-direction:column;
}
@media (max-width:440px),(display-mode:standalone){
  body{padding:0;background:var(--bg);align-items:stretch}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
/* safe area + стандартные поля 16pt */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 50px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
@media (max-width:440px),(display-mode:standalone){
  .screen{padding-top:calc(env(safe-area-inset-top) + 12px)}
}
/* контент всегда влезает в экран: при нехватке места скрипт его ужимает */
.fit{flex:none;display:flex;flex-direction:column;transform-origin:top left;will-change:transform}
.grow{flex:1 1 0;min-height:0}

/* navigation bar с Large Title */
.navbar{display:flex;align-items:center;gap:10px;flex:none;margin-bottom:4px}
.navbar h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin-right:auto}
.iconbtn{width:34px;height:34px;flex:none;border:none;border-radius:17px;background:var(--fill3);
  color:var(--blue);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.datefield{font-size:16px;color:var(--label);background:var(--fill3);border:none;border-radius:8px;padding:6px 10px;min-height:34px}

/* заголовок группы — выровнен по тексту внутри карточки */
.secthead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex:none;padding:0 16px;margin:16px 0 7px;min-height:20px}
.secthead>span{font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:.06em}
.secthead .till{color:var(--red);flex:none}

/* карточка inset grouped */
.card{flex:none;background:var(--card);border-radius:12px;padding-left:16px}
.card.pad{padding:14px 16px}

/* поле суммы */
.inputrow{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 0;min-height:56px}
.inputrow input{flex:1;min-width:0;border:none;background:none;color:var(--label);
  font-family:var(--num);font-size:34px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.inputrow input::placeholder{color:var(--label3)}
.inputrow input:focus{outline:none}

/* segmented control */
.seg,.curseg{display:flex;flex:none;background:var(--fill3);border-radius:9px;padding:2px}
.seg{margin-top:0}
.segbtn,.curbtn{flex:1;border:none;background:none;color:var(--label);cursor:pointer;
  border-radius:7px;font-size:13px;font-weight:500;padding:0;height:32px;white-space:nowrap}
.segbtn.on,.curbtn.on{background:var(--seg-on);box-shadow:var(--seg-shadow);font-weight:600}
.curseg{padding:2px}
.curbtn{height:26px;font-size:12px;padding:0 10px;flex:none}
.curbtn:disabled{color:var(--label3);cursor:default}
/* HIG: минимальная зона нажатия 44pt — расширяем её, не увеличивая сам контрол */
.iconbtn,.curbtn{position:relative}
.iconbtn::after{content:"";position:absolute;left:-5px;right:-5px;top:-5px;bottom:-5px}
.curbtn::after{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.curbtn:disabled.on{color:var(--label2)}

/* главное число */
.amountrow{display:flex;align-items:baseline;gap:7px}
.amount{font-family:var(--num);font-size:44px;line-height:1.06;font-weight:700;letter-spacing:-.6px;
  color:var(--red);font-variant-numeric:tabular-nums}
.amount.idle{font-family:var(--sans);font-size:20px;font-weight:400;letter-spacing:0;color:var(--label3)}
.unit{font-size:15px;font-weight:600;color:var(--label2)}

/* будни и выходные — рядом */
.split{display:flex;gap:12px;margin-top:13px;padding-top:12px;border-top:1px solid var(--separator)}
.split:empty{display:none}
.split div{flex:1;min-width:0}
.split i{display:block;font-style:normal;font-size:13px;color:var(--label2)}
.split b{display:block;font-family:var(--num);font-size:22px;font-weight:600;letter-spacing:-.2px;
  font-variant-numeric:tabular-nums;margin-top:2px}
.split .none{opacity:.4}

.warn{display:none;font-size:13px;line-height:1.35;color:var(--red);background:var(--red-soft);
  border-radius:10px;padding:8px 10px;margin-top:12px}
.warn.on{display:block}

/* календарная лента и список выплат — одна карточка */
.ribbon{padding:14px 16px 11px 0}
.ticks{display:flex;align-items:stretch;gap:2px;height:22px}
.tick{flex:1;min-width:0;border-radius:2px;background:var(--tick-work)}
.tick.past{background:var(--tick-past)}
.tick.off{background:var(--tick-off)}
.tick.mark{background:var(--red)}
.ticklab{position:relative;height:13px;margin-top:7px;font-size:11px;font-weight:600}
.ticklab span{position:absolute;top:0;white-space:nowrap;color:var(--red);font-variant-numeric:tabular-nums}

.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  min-height:44px;padding:7px 16px 7px 0;border-top:1px solid var(--separator)}
.row .d{font-family:var(--num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.row .t{font-size:17px;line-height:22px}
.row .t small{display:block;font-size:12px;line-height:16px;color:var(--label2)}
.row .s{font-size:15px;color:var(--label2);text-align:right;font-variant-numeric:tabular-nums}
.row .s em{font-style:normal;font-weight:600;color:var(--label);margin-right:6px}

/* подвал группы */
.rate{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:0 16px;margin-top:8px;font-size:13px;line-height:18px;color:var(--label2)}
.rate button{border:none;background:none;color:var(--blue);font-size:13px;cursor:pointer;flex:none;padding:0}
.rate input{font-family:var(--num);font-size:16px;font-weight:600;color:var(--label);width:82px;
  border:none;border-radius:6px;background:var(--fill3);padding:1px 6px;text-align:center}
.rate input:focus{outline:none}
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">
   <div class="fit" id="fit">

    <div class="navbar">
      <h1>Лимиты</h1>
      <button type="button" class="iconbtn" id="themeBtn" aria-label="Сменить тему"></button>
      <input type="date" class="datefield" id="dateInput" aria-label="Дата отсчёта">
    </div>

    <div class="secthead">
      <span id="moneyLabel">Осталось денег</span>
      <span class="till" id="daysLabel"></span>
    </div>
    <div class="card">
      <div class="inputrow">
        <input id="money" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-labelledby="moneyLabel">
        <div class="curseg" id="curIn" role="group" aria-label="Валюта ввода">
          <button type="button" class="curbtn on" data-cur="BYN">BYN</button>
          <button type="button" class="curbtn" data-cur="USD" disabled>USD</button>
        </div>
      </div>
    </div>

    <div class="secthead"><span>Будний : выходной</span></div>
    <div class="seg" id="seg" role="group" aria-label="Соотношение будний день к выходному">
      <button type="button" class="segbtn" data-k="1">1 : 1</button>
      <button type="button" class="segbtn on" data-k="1.5">2 : 3</button>
      <button type="button" class="segbtn" data-k="2">1 : 2</button>
    </div>

    <div class="secthead">
      <span id="bandLabel">На сегодня</span>
      <div class="curseg" id="curOut" role="group" aria-label="Валюта вывода">
        <button type="button" class="curbtn on" data-cur="BYN">BYN</button>
        <button type="button" class="curbtn" data-cur="USD" disabled>USD</button>
      </div>
    </div>
    <div class="card pad">
      <div class="amountrow">
        <span class="amount idle" id="perDay">Нет данных</span>
        <span class="unit" id="unitLabel"></span>
      </div>
      <div class="split" id="splitLine"></div>
      <div class="warn" id="warnLine"></div>
    </div>

    <div class="grow"></div>

    <div class="card">
      <div class="ribbon">
        <div class="ticks" id="ticks"></div>
        <div class="ticklab" id="tickLabels"></div>
      </div>
      <div id="list"></div>
    </div>

    <div class="rate" id="rateLine"><span>Курс НБ РБ загружается…</span></div>
   </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var AVANS = 300;                 // аванс — фиксированная сумма, BYN

  var FIXED=[[1,1],[1,2],[1,7],[3,8],[5,1],[5,9],[7,3],[11,7],[12,25]];
  function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
  function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  function diffDays(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);}
  function orthodoxEaster(y){var a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;return new Date(y,m-1,day+13);}
  function radunitsa(y){return addDays(orthodoxEaster(y),9);}
  function isHoliday(d){var m=d.getMonth()+1,day=d.getDate();for(var i=0;i<FIXED.length;i++)if(FIXED[i][0]===m&&FIXED[i][1]===day)return true;var r=radunitsa(d.getFullYear());return r.getMonth()===d.getMonth()&&r.getDate()===d.getDate();}
  function isDayOff(d){var w=d.getDay();return w===0||w===6||isHoliday(d);}
  function shiftBack(d){var x=d,g=0;while(isDayOff(x)&&g++<20)x=addDays(x,-1);return x;}

  // все выплаты СТРОГО после указанной даты, по возрастанию
  function payouts(from,count){
    var res=[],y=from.getFullYear(),mo=from.getMonth();
    var kinds=[[10,'Зарплата'],[24,'Аванс']];
    for(var k=-1;k<=6;k++)for(var i=0;i<kinds.length;i++){
      var nominal=new Date(y,mo+k,kinds[i][0]),actual=shiftBack(nominal);
      if(diffDays(from,actual)>0)res.push({nominal:nominal,actual:actual,kind:kinds[i][1]});
    }
    res.sort(function(a,b){return a.actual-b.actual;});
    return res.slice(0,count);
  }

  // последняя зарплата не позже указанной даты — начало календарного цикла
  function prevSalary(base){
    var y=base.getFullYear(),mo=base.getMonth(),best=null;
    for(var k=-2;k<=1;k++){
      var act=shiftBack(new Date(y,mo+k,10));
      if(diffDays(act,base)>=0 && (!best||act>best)) best=act;
    }
    return best;
  }
  // авансы строго между двумя датами
  function avansBetween(from,to){
    var y=from.getFullYear(),mo=from.getMonth(),res=[];
    for(var k=-1;k<=2;k++){
      var act=shiftBack(new Date(y,mo+k,24));
      if(diffDays(from,act)>0 && diffDays(act,to)>0) res.push(act);
    }
    return res;
  }

  var WD=['вс','пн','вт','ср','чт','пт','сб'];
  var nf=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
  var nf4=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:4,maximumFractionDigits:4});
  function pad(n){return (n<10?'0':'')+n;}
  function dm(d){return pad(d.getDate())+'.'+pad(d.getMonth()+1);}
  function plural(n,a,b,c){var x=n%10,y=n%100;if(x===1&&y!==11)return a;if(x>=2&&x<=4&&(y<10||y>=20))return b;return c;}

  var $=function(id){return document.getElementById(id);};
  var elDate=$('dateInput'),elMoney=$('money'),elPerDay=$('perDay'),elUnit=$('unitLabel'),
      elBandLabel=$('bandLabel'),elSplit=$('splitLine'),
      elWarn=$('warnLine'),elDays=$('daysLabel'),
      elTicks=$('ticks'),elTickLabels=$('tickLabels'),elSeg=$('seg'),elCurIn=$('curIn'),
      elCurOut=$('curOut'),elList=$('list'),elRate=$('rateLine'),
      elScreen=$('screen'),elFit=$('fit'),elTheme=$('themeBtn');

  /* ---------- тема ---------- */
  var root=document.documentElement;
  var ICON_MOON='<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">'+
    '<path fill="currentColor" d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3a8.9 8.9 0 1 0 11.3 11.3z"/></svg>';
  var ICON_SUN='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">'+
    '<circle cx="12" cy="12" r="4.4" fill="currentColor"/>'+
    '<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">'+
    '<path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></g></svg>';
  function paintTheme(){
    var dark=root.getAttribute('data-theme')==='dark';
    elTheme.innerHTML=dark?ICON_SUN:ICON_MOON;
    var meta=$('themeColor');
    if(meta) meta.setAttribute('content',dark?'#000000':'#F2F2F7');
  }
  elTheme.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{ localStorage.setItem('theme',next); }catch(e){}
    paintTheme();
    autofit();
  });
  paintTheme();

  /* ---------- вписывание в экран ----------
     контент никогда не скроллится: если не влезает по высоте — весь блок
     ужимается через transform, а его ширина компенсируется, чтобы после
     масштабирования он занимал экран целиком */
  /* подписи выплат: держим внутри ленты и не даём наезжать друг на друга */
  var lastMarks=[],lastTotal=0;
  function layoutTickLabels(){
    var W=elTickLabels.clientWidth;
    if(!W||!lastTotal) return;
    var GAP=6;
    var pos=Array.prototype.map.call(elTickLabels.children,function(el,i){
      var w=el.offsetWidth, c=(lastMarks[i].i+0.5)/lastTotal*W;
      return {el:el,w:w,x:Math.max(0,Math.min(W-w,c-w/2))};
    });
    for(var i=1;i<pos.length;i++){
      var minX=pos[i-1].x+pos[i-1].w+GAP;
      if(pos[i].x<minX) pos[i].x=minX;
    }
    for(var j=pos.length-1;j>=0;j--){
      var maxX=(j===pos.length-1?W:pos[j+1].x-GAP)-pos[j].w;
      if(pos[j].x>maxX) pos[j].x=Math.max(0,maxX);
    }
    pos.forEach(function(p){ p.el.style.left=p.x+'px'; p.el.style.right='auto'; });
  }

  var MINK=0.35;
  function autofit(){
    elFit.style.transform='none';
    elFit.style.width='100%';
    elFit.style.height='auto';

    var cs=getComputedStyle(elScreen);
    var availH=elScreen.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    var availW=elScreen.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    if(!(availH>0&&availW>0)) return;

    // при другой ширине текст перетекает и высота меняется — сходимся за пару итераций
    var k=1;
    for(var i=0;i<4;i++){
      var want=Math.max(MINK,Math.min(1,availH/elFit.scrollHeight));
      var done=Math.abs(want-k)<0.005;
      k=want;
      if(k>=1){ elFit.style.width='100%'; break; }
      elFit.style.width=(availW/k)+'px';
      if(done) break;
    }
    // страховка: при выбранном масштабе контент обязан помещаться в рамку
    var h=elFit.scrollHeight;
    if(h*k>availH+0.5){
      k=Math.max(MINK,availH/h);
      elFit.style.width=(availW/k)+'px';
    }

    elFit.style.width=k<1?(availW/k)+'px':'100%';
    elFit.style.height=(availH/k)+'px';
    elFit.style.transform=k<1?'scale('+k+')':'none';

    layoutTickLabels();   // ширина ленты изменилась — пересчитать подписи
  }

  var today=midnight(new Date());
  elDate.value=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());

  var weekendK=1.5;
  var inCur='BYN';        // валюта, в которой вводят остаток
  var outCur='BYN';       // валюта, в которой показывают лимит
  var usdRate=null;       // BYN за 1 USD
  var rateDate=null;
  var rateManual=false;

  function parseMoney(s){
    var v=String(s).replace(/[\s ]/g,'').replace(',','.').replace(/[^\d.]/g,'');
    var n=parseFloat(v);
    return isFinite(n)&&n>=0?n:null;
  }

  function pick(seg,cur){
    Array.prototype.forEach.call(seg.children,function(x){x.classList.toggle('on',x.dataset.cur===cur);});
  }

  function usdOn(on){
    [elCurIn,elCurOut].forEach(function(seg){
      seg.querySelector('[data-cur="USD"]').disabled=!on;
    });
    if(!on){
      if(inCur==='USD'){ inCur='BYN'; pick(elCurIn,'BYN'); }
      if(outCur==='USD'){ outCur='BYN'; pick(elCurOut,'BYN'); }
    }
  }

  function rateOk(){
    usdOn(true);
    elRate.innerHTML=
      '<span>'+(rateManual?'Курс вручную':'Курс НБ РБ')+' · 1 USD = '+nf4.format(usdRate)+' BYN'+
      (rateDate?' · '+dm(rateDate):'')+'</span>'+
      '<button type="button" id="rateEdit">'+(rateManual?'обновить':'изменить')+'</button>';
    $('rateEdit').addEventListener('click', rateManual ? loadRate : rateForm);
    render();
  }

  function rateForm(msg){
    usdOn(!!usdRate);
    elRate.innerHTML=
      '<span>'+(typeof msg==='string'?msg:'Курс вручную')+' · 1 USD = <input id="rateInput" type="text" inputmode="decimal" '+
      'placeholder="0,0000" value="'+(usdRate?nf4.format(usdRate):'')+'" aria-label="Курс доллара"> BYN</span>'+
      '<button type="button" id="rateRetry">загрузить</button>';
    var inp=$('rateInput');
    inp.addEventListener('input',function(){
      var v=parseMoney(inp.value);
      if(v&&v>0){ usdRate=v; rateManual=true; rateDate=null; usdOn(true); }
      else usdOn(false);
      render();
    });
    $('rateRetry').addEventListener('click',loadRate);
    render();
  }

  /* официальный курс НБ РБ — тот же, что публикует myfin.by */
  function loadRate(){
    elRate.innerHTML='<span>Курс НБ РБ загружается…</span>';
    autofit();
    fetch('https://api.nbrb.by/exrates/rates/USD?parammode=2',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        usdRate=d.Cur_OfficialRate/(d.Cur_Scale||1);
        rateDate=new Date(d.Date);
        rateManual=false;
        rateOk();
      })
      .catch(function(){
        rateForm('Курс не загрузился — впишите');
      });
  }

  function render(){
    var parts=elDate.value.split('-');
    var base=parts.length===3?new Date(+parts[0],+parts[1]-1,+parts[2]):today;
    if(isNaN(base)) base=today;

    var next=payouts(base,6);

    // период считаем до ближайшей ЗАРПЛАТЫ
    var salary=null;
    for(var s=0;s<next.length;s++) if(next[s].kind==='Зарплата'){ salary=next[s]; break; }
    var days=diffDays(base,salary.actual);

    // аванс добавляем к сумме только пока он ВПЕРЕДИ:
    // в день аванса деньги уже на руках — они учтены в «осталось денег», второй раз не плюсуем
    var avansDays=[];
    for(var v=0;v<next.length;v++){
      if(next[v].kind==='Аванс' && next[v].actual<salary.actual) avansDays.push(diffDays(base,next[v].actual));
    }
    var avansTotal=avansDays.length*AVANS;

    // раскладка дней
    var kinds=[],nOff=0,nWork=0;
    for(var i=0;i<days;i++){
      var off=isDayOff(addDays(base,i));
      kinds.push(off); off?nOff++:nWork++;
    }

    var typed=parseMoney(elMoney.value);
    var money = typed===null ? null
              : (inCur==='USD'&&usdRate ? typed*usdRate : typed);   // всё считаем в BYN
    var todayOff=kinds[0];
    elBandLabel.textContent='На сегодня · '+(todayOff?'выходной':'будний день');

    elWarn.classList.remove('on');

    // дни до зарплаты — рядом с «осталось денег»
    elDays.textContent='до зп '+days+' '+plural(days,'день','дня','дней');

    if(money===null){
      elPerDay.classList.add('idle');
      elPerDay.textContent='Нет данных';
      elUnit.textContent=''; elSplit.innerHTML='';
    } else {
      var pot=money+avansTotal;
      var unit=pot/(nWork+weekendK*nOff);
      var workSum=unit,offSum=unit*weekendK;
      var mine=todayOff?offSum:workSum;

      elPerDay.classList.remove('idle');
      var shown=(outCur==='USD'&&usdRate)?mine/usdRate:mine;
      elPerDay.textContent=nf.format(shown);
      elUnit.textContent=outCur;

      // будни и выходные — рядом, только суммы, в валюте вывода.
      // тип дня, которого в остатке периода нет, показываем прочерком:
      // множитель на него не влияет, и число было бы выдуманным
      var conv=function(x){ return (outCur==='USD'&&usdRate)?x/usdRate:x; };
      elSplit.innerHTML=
        '<div'+(nWork?'':' class="none"')+'><i>Будни</i><b>'+(nWork?nf.format(conv(workSum)):'—')+'</b></div>'+
        '<div'+(nOff?'':' class="none"')+'><i>Выходные</i><b>'+(nOff?nf.format(conv(offSum)):'—')+'</b></div>';

      // хватит ли денег дожить до аванса
      if(avansDays.length){
        var idx=avansDays[0],need=0;
        for(var q=0;q<idx;q++) need+=kinds[q]?offSum:workSum;
        if(need>money+0.005){
          elWarn.textContent='До аванса нужно '+nf.format(need)+' BYN, а на руках '+nf.format(money)+
                             '. Первые '+idx+' '+plural(idx,'день','дня','дней')+' придётся ужаться.';
          elWarn.classList.add('on');
        }
      }
    }

    // календарь: от прошлой зарплаты до следующей, включая обе
    var cycleStart=prevSalary(base);
    var cycleAvans=avansBetween(cycleStart,salary.actual);
    var total=diffDays(cycleStart,salary.actual)+1;

    elTicks.innerHTML='';
    elTickLabels.innerHTML='';
    var marks=[];
    for(var t=0;t<total;t++){
      var day=addDays(cycleStart,t);
      var cls='tick', isAvans=false;
      for(var c=0;c<cycleAvans.length;c++) if(diffDays(cycleAvans[c],day)===0) isAvans=true;

      // аванс отмечаем красным так же, как зарплату
      if(t===0||t===total-1||isAvans){ cls+=' mark'; marks.push({i:t,d:day}); }
      else if(diffDays(day,base)>0) cls+=' past';
      else if(isDayOff(day)) cls+=' off';

      var el=document.createElement('div');
      el.className=cls;
      el.title=dm(day)+' '+WD[day.getDay()];
      elTicks.appendChild(el);
    }

    for(var mk=0;mk<marks.length;mk++){
      var lab=document.createElement('span');
      lab.textContent=dm(marks[mk].d)+' ('+WD[marks[mk].d.getDay()]+')';
      elTickLabels.appendChild(lab);
    }
    lastMarks=marks; lastTotal=total;
    layoutTickLabels();

    elList.innerHTML='';
    for(var j=0;j<3;j++){
      var p=next[j],moved=diffDays(p.nominal,p.actual)!==0;
      var row=document.createElement('div'); row.className='row';
      row.innerHTML=
        '<span class="d">'+dm(p.actual)+'</span>'+
        '<span class="t">'+p.kind+(moved?'<small>перенос с '+dm(p.nominal)+'</small>':'')+'</span>'+
        '<span class="s">'+(p.kind==='Аванс'?'<em>+'+nf.format(AVANS)+'</em>':'')+WD[p.actual.getDay()]+'</span>';
      elList.appendChild(row);
    }

    autofit();
  }

  elSeg.addEventListener('click',function(e){
    var b=e.target.closest('.segbtn'); if(!b) return;
    weekendK=parseFloat(b.dataset.k);
    Array.prototype.forEach.call(elSeg.children,function(x){x.classList.toggle('on',x===b);});
    render();
  });
  elCurIn.addEventListener('click',function(e){
    var b=e.target.closest('.curbtn'); if(!b||b.disabled||b.dataset.cur===inCur) return;
    var v=parseMoney(elMoney.value);
    if(v!==null&&usdRate){                       // сумма та же, меняется единица счёта
      elMoney.value=nf.format(b.dataset.cur==='USD' ? v/usdRate : v*usdRate);
    }
    inCur=b.dataset.cur;
    pick(elCurIn,inCur);
    render();
  });
  elCurOut.addEventListener('click',function(e){
    var b=e.target.closest('.curbtn'); if(!b||b.disabled||b.dataset.cur===outCur) return;
    outCur=b.dataset.cur;
    pick(elCurOut,outCur);
    render();
  });
  elMoney.addEventListener('input',render);
  elDate.addEventListener('change',render);

  // при открытой клавиатуре высота вьюпорта скачет — не пересчитываем масштаб
  function onResize(){
    var a=document.activeElement;
    if(a&&(a.tagName==='INPUT')) return;
    autofit();
  }
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',function(){setTimeout(autofit,150);});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(autofit);

  render();
  loadRate();
})();
</script>
</body>
</html>
